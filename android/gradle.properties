org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Reliability on Windows: avoid Kotlin incremental-cache corruption (cross-drive paths)
# and detached Kotlin daemon hangs.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
